<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<title>MailApp</title>
<script>
  // Apply the saved theme before the page paints (no flash).
  try { const t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="apple-mobile-web-app-title" content="MailApp">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app" class="show-list">
  <nav id="rail">
    <div class="logo" title="MailApp"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="3"/><path d="m22 7-10 6L2 7"/></svg></div>
    <div id="railAccts"></div>
    <button class="tile add" id="addBtn" title="Add an account"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <div class="grow"></div>
    <button class="rail-btn" id="notifyBtn" title="Notifications"></button>
    <button class="rail-btn" id="themeBtn" title="Theme"></button>
    <button class="rail-btn" id="logoutBtn" title="Lock (sign out)"><svg viewBox="0 0 24 24"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg></button>
  </nav>

  <header id="top">
    <div class="acct-switch">
      <button id="acctBtn" aria-haspopup="true"><span class="dot" id="acctDot"></span><span id="acctName">MailApp</span>
        <svg class="chev" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button>
      <div class="menu" id="acctMenu" hidden></div>
    </div>
    <div class="tabs" id="tabs">
      <button data-box="inbox"><svg viewBox="0 0 24 24"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg><span class="lbl">Inbox</span><span class="badge" id="tab-inbox"></span></button>
      <button data-box="spam"><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="M12 8v4M12 16h.01"/></svg><span class="lbl">Spam</span><span class="badge" id="tab-spam"></span></button>
    </div>
    <div class="grow"></div>
    <button class="btn compose-btn" id="composeBtn" title="New message (C)"><svg viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>New message</span></button>
    <button class="icon" id="refreshBtn" title="Refresh"><svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg></button>
  </header>

  <main id="panel">
    <section id="listPane">
      <div class="listbar" id="listBar">
        <input type="checkbox" class="check" id="checkAll" title="Select all">
        <div class="info" id="listInfo"></div>
        <button class="pill" id="readAllBtn" title="Mark the whole folder as read"><svg viewBox="0 0 24 24"><path d="M18 6 7 17l-5-5M22 10l-7.5 7.5L13 16"/></svg><span>All read</span></button>
      </div>
      <div class="listbar bulk" id="bulkBar" hidden>
        <input type="checkbox" class="check" id="checkAll2" title="Select all">
        <div class="info" id="selInfo"></div>
        <button class="icon sm" data-bulk="read" title="Mark read"><svg viewBox="0 0 24 24"><path d="M21.2 8.4c.5.38.8.97.8 1.6v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V10a2 2 0 0 1 .8-1.6l8-6a2 2 0 0 1 2.4 0l8 6Z"/><path d="m22 10-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 10"/></svg></button>
        <button class="icon sm" data-bulk="unread" title="Mark unread"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg></button>
        <button class="icon sm" data-bulk="flag" title="Star"><svg viewBox="0 0 24 24"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg></button>
        <button class="icon sm" data-bulk="notspam" title="Not spam" hidden><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg></button>
        <button class="icon sm" data-bulk="archive" title="Archive"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg></button>
        <button class="icon sm danger" data-bulk="delete" title="Delete"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg></button>
        <button class="icon sm" id="clearSel" title="Clear selection"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
      </div>
      <div id="list"></div>
    </section>

    <section id="readPane">
      <header class="readbar" id="readBar" hidden>
        <button class="icon only-mobile" id="backBtn" title="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <button class="act" id="replyBtn" title="Reply (R)"><svg viewBox="0 0 24 24"><path d="M9 17 4 12l5-5"/><path d="M20 18v-2a4 4 0 0 0-4-4H4"/></svg><span>Reply</span></button>
        <button class="act" id="replyAllBtn" title="Reply all (A)"><svg viewBox="0 0 24 24"><path d="m7 17-5-5 5-5"/><path d="m12 17-5-5 5-5"/><path d="M22 18v-2a4 4 0 0 0-4-4H7"/></svg><span>Reply all</span></button>
        <button class="act" id="forwardBtn" title="Forward (F)"><svg viewBox="0 0 24 24"><path d="m15 17 5-5-5-5"/><path d="M4 18v-2a4 4 0 0 1 4-4h12"/></svg><span>Forward</span></button>
        <div class="grow"></div>
        <button class="act" id="unreadBtn" title="Mark unread (U)"><svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-10 6L2 7"/></svg><span>Unread</span></button>
        <button class="act" id="notSpamBtn" title="Not spam" hidden><svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10"/><path d="m9 12 2 2 4-4"/></svg><span>Not spam</span></button>
        <button class="act" id="flagBtn" title="Star (S)"><svg viewBox="0 0 24 24"><path d="m12 2 3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01z"/></svg><span>Star</span></button>
        <button class="act" id="archiveBtn" title="Archive (E)"><svg viewBox="0 0 24 24"><rect x="2" y="3" width="20" height="5" rx="1"/><path d="M4 8v11a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8M10 12h4"/></svg><span>Archive</span></button>
        <button class="act danger" id="deleteBtn" title="Delete (#)"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6"/></svg><span>Delete</span></button>
      </header>
      <div id="reader"></div>
    </section>
  </main>
</div>
<div class="overlay" id="addModal" hidden>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="addTitle">
    <div id="addPick">
      <h2 id="addTitle">Add an account</h2>
      <p class="sub">Pick your provider to continue.</p>
      <label class="search"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg><input id="addSearch" placeholder="Search…" autocomplete="off"></label>
      <div class="sect">Favorites</div>
      <div class="grid" id="provGrid"></div>
    </div>
    <form id="addForm" hidden autocomplete="off">
      <div class="form-head"><button type="button" class="icon" id="addBack" title="Back"><svg viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg></button>
        <span class="plogo" id="formLogo"></span><h2 id="formTitle"></h2></div>
      <div id="formFields"></div>
      <div class="form-err" id="formErr" hidden></div>
    </form>
    <div class="modal-foot">
      <button type="button" class="ghost" id="addCancel">Cancel</button>
      <button type="submit" form="addForm" class="btn" id="addSubmit" hidden>Add</button>
    </div>
  </div>
</div>
<div class="overlay" id="composeModal" hidden>
  <form class="modal compose" id="composeForm" role="dialog" aria-modal="true" aria-labelledby="composeTitle" autocomplete="off">
    <div class="c-head"><h2 id="composeTitle">New message</h2><div class="grow"></div>
      <button type="button" class="icon" id="composeClose" title="Close"><svg viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
    <div class="c-row"><label for="cFrom">From</label><select id="cFrom" name="from"></select></div>
    <div class="c-row"><label for="cTo">To</label><input id="cTo" name="to" type="text" inputmode="email" placeholder="name@example.com, …">
      <button type="button" class="c-more" id="cMoreBtn">Cc Bcc</button></div>
    <div class="c-row" id="cCcRow" hidden><label for="cCc">Cc</label><input id="cCc" name="cc" type="text" inputmode="email"></div>
    <div class="c-row" id="cBccRow" hidden><label for="cBcc">Bcc</label><input id="cBcc" name="bcc" type="text" inputmode="email"></div>
    <div class="c-row"><label for="cSubject">Subject</label><input id="cSubject" name="subject" type="text"></div>
    <textarea id="cBody" name="body" dir="auto" placeholder="Write your message…"></textarea>
    <div class="c-files" id="cFiles"></div>
    <div class="form-err" id="cErr" hidden></div>
    <div class="c-foot">
      <button type="submit" class="btn" id="cSend"><svg viewBox="0 0 24 24"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4z"/></svg><span>Send</span></button>
      <label class="icon" title="Attach files"><svg viewBox="0 0 24 24"><path d="m21.44 11.05-9.19 9.19a6 6 0 0 1-8.49-8.49l8.57-8.57A4 4 0 1 1 18 8.84l-8.59 8.57a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg><input type="file" id="cAttach" multiple hidden></label>
      <span class="c-hint">⌘ + Enter to send</span>
      <div class="grow"></div>
      <button type="button" class="icon danger" id="cDiscard" title="Discard draft"><svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg></button>
    </div>
  </form>
</div>
<script src="app.js"></script>
</body>
</html>
